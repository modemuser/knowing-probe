[project]
name = "knowing-probe"
version = "0.0.0"
description = "Difference-of-means probes on Qwen3 residual streams: does the model's state separate known from unknown facts before it answers?"
requires-python = ">=3.11"
dependencies = [
    "contrastset[hf]",
    "torch==2.14.1",
    "transformers==5.21.0",
    "numpy>=2",
    "matplotlib>=3.9",
    "httpx>=0.27",
]

[tool.uv.sources]
contrastset = { path = "../contrastset", editable = true }

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
