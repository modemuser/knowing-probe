[project]
name = "knowing-probe"
version = "0.1.0"
description = "Pre-registered probe for a retrieval (known-vs-unknown) direction in Qwen3-8B, built on contrastset. Confirmatory test not yet run."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Misera" }]
dependencies = [
    "contrastset==0.1.0.post1",
    "numpy>=2",
    "matplotlib>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Activation reads (scripts/*_acts.py) and the HF adapter: the exact versions the runs used.
hf = [
    "contrastset[hf]==0.1.0.post1",
    "torch==2.14.1",
    "transformers==5.21.0",
]

[project.urls]
Repository = "https://github.com/modemuser/knowing-probe"
"Library (contrastset)" = "https://github.com/modemuser/contrastset"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
